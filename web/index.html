<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <script>
    (function () {
      var stored = null;
      try { stored = localStorage.getItem('color-scheme'); } catch (e) {}
      var content = (stored === 'light' || stored === 'dark') ? stored : 'light dark';
      var csMeta = document.querySelector('meta[name="color-scheme"]');
      if (csMeta) csMeta.setAttribute('content', content);
      if (stored === 'light' || stored === 'dark') {
        document.documentElement.dataset.theme = stored;
      }
      var isDark = stored === 'dark' || (!stored && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      var bgHex = isDark ? '#202020' : '#f3f3f3';
      try {
        var cachedPal = JSON.parse(localStorage.getItem('accent-palette') || 'null');
        var tint = cachedPal && (isDark ? cachedPal.dark3 : cachedPal.light3);
        if (tint && /^#[0-9a-f]{6}$/i.test(tint)) {
          var ratio = isDark ? 0.14 : 0.06;
          var mix = function (a, b) { return Math.max(0, Math.min(255, Math.round(a * ratio + b * (1 - ratio)))).toString(16).padStart(2, '0'); };
          bgHex = '#' + mix(parseInt(tint.slice(1, 3), 16), parseInt(bgHex.slice(1, 3), 16)) + mix(parseInt(tint.slice(3, 5), 16), parseInt(bgHex.slice(3, 5), 16)) + mix(parseInt(tint.slice(5, 7), 16), parseInt(bgHex.slice(5, 7), 16));
        }
      } catch (e) {}
      var tc = document.createElement('meta');
      tc.name = 'theme-color';
      tc.id = 'meta-theme-color';
      tc.content = bgHex;
      document.head.appendChild(tc);
    })();
  </script>
  <title>PC-Operator-MCP — Panel de control</title>
  <link rel="icon" type="image/svg+xml" href="/admin/assets/favicon.svg?v=4" />
  <link rel="icon" type="image/png" sizes="32x32" href="/admin/assets/icon-32.png?v=4" />
  <link rel="apple-touch-icon" sizes="192x192" href="/admin/assets/icon-192.png?v=4" />
  <link rel="manifest" href="/admin/assets/manifest.webmanifest?v=4" />
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
